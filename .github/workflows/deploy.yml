name: Build Sitemap and Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate sitemap.xml
        run: python generate-sitemap.py

      - name: Verify sitemap.xml
        run: |
          test -f sitemap.xml
          test -s sitemap.xml
          python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('sitemap.xml is valid XML')"
          echo "----- sitemap.xml -----"
          cat sitemap.xml
          echo "-----------------------"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
